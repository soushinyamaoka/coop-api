schema_version: 1
app: coop-api

canonical_repo: https://github.com/soushinyamaoka/coop-api.git
canonical_ref: main
updated_at: 2026-09-27
verified_against_runtime: null   # 本ファイルは現時点でVPS実機との照合を行っていない。runtime/network/config系の記述はCLAUDE.md記載のVPS安全化後契約（2026-08-22実施）に基づく宣言であり、data/jobs/dependenciesのJev関連項目は本アプリ側の実装（未deploy）を反映した宣言。実機照合日を推測で埋めない。

runtime:
  type: systemd
  unit: coop-api.service
  working_directory: /opt/apps/coop-api
  user: coop-api
  group: coop-api
  language_runtime: python3.10   # requirements.txt/CLAUDE.mdの推奨版。実機の正確なpatch versionは未照合
  os_packages: []
  restart_policy: null   # unit file未照合のため不明。推測で埋めない

network:
  listeners:
    - bind: 127.0.0.1
      port: 8003
      protocol: http
  public:
    - url: https://coop.homehub-tools.dedyn.io
      upstream: 127.0.0.1:8003
      tls: null   # 証明書方式は未照合
  health:
    internal:
      path: /
      expected_status: 200
      auth_required: false
    public:
      path: /
      expected_status: 200

config:
  env_file: /opt/apps/coop-api/.env   # root:coop-api 0640。deploy artifactに含めない
  env_vars:
    - { name: GMAIL_ADDRESS, required: true, secret: true }
    - { name: GMAIL_APP_PASSWORD, required: true, secret: true }
    - { name: COOP_SENDER, required: false, secret: false }
    - { name: API_HOST, required: false, secret: false }
    - { name: API_PORT, required: false, secret: false }
    - { name: API_TOKEN, required: true, secret: true }
    - { name: CATEGORY_CLASSIFIER, required: false, secret: false }   # 2026-09-27追加。keyword|jev。未設定はkeyword
    - { name: TYPESAFE_API_KEY, required: false, secret: true }        # 2026-09-27追加。CATEGORY_CLASSIFIER=jev時のみ実質必須。値未設定ならjev指定でもkeywordへfallback
  secret_provisioning: manual
  note: >
    Jev有効化（CATEGORY_CLASSIFIER=jevへの切替とTYPESAFE_API_KEYのprovisioning）はnotice
    20260927-COOPAPI-004で申請中。VPS管理レビューと別途production承認が完了するまでは
    keyword分類を維持し、keyをprovisioningしない。

data:
  databases: []
  persistent_paths:
    - path: /opt/apps/coop-api/data/coop_orders.json
      backup_required: true
      regenerable: false
      note: 取込ごとに orders 配列（通常1件）で上書きされ、実行間で蓄積されない。2026-09-27にsource_fingerprint項目を追加（既存データの移行不要）。
    - path: /opt/apps/coop-api/data/coop_latest.json
      backup_required: true
      regenerable: false
      note: 最新1件の派生ファイル（coop_orders.jsonから再生成可能だが、直近の在庫計算がこのfileに依存するため運用上はbackup対象）。
    - path: /opt/apps/coop-api/data/category_overrides.json
      backup_required: true
      regenerable: false
      note: ユーザーによるカテゴリ手動学習データ。失えばユーザー操作の再入力が必要。
    - path: /opt/apps/coop-api/data/custom_meals.json
      backup_required: true
      regenerable: false
      note: ユーザーが登録・編集したカスタム献立とレシピを保存する。APIで削除されたデータはアプリ内から再生成できず、ユーザーによる再入力が必要。
    - path: /opt/apps/coop-api/data/category_jev_cache.json
      backup_required: false
      regenerable: true
      note: >
        2026-09-27新規。商品名→Jev判定結果のcacheのみ。欠損・破損時は空cacheとして継続し、
        次回Jev問い合わせ時に再生成される。CATEGORY_CLASSIFIER=jev未使用の現状は生成されない。
    - path: /opt/apps/coop-api/data/.coop_import.lock
      backup_required: false
      regenerable: true
      note: OSがロック状態を管理するための空または未使用内容のファイル。残存しても次回取得を妨げない。
  migrations: none

jobs:
  - name: coop-mail-import
    mechanism: cron
    definition: /etc/cron.d/coop-api
    schedule: "0 7,20 * * *"
    success_signal: >
      stdout構造化ログの job_end イベント（job=coop-mail-import, status=success|failure,
      duration_ms）。2026-09-27時点で監視システムへの自動連携（alert等）は未整備、ログ上の確認のみ。
      同一注文時は import_skipped（reason=unchanged）を伴う success として記録される。
    concurrency_control: file_lock
    concurrency_note: >
      cron（07:00/20:00 JST固定）と手動 `POST /api/coop/fetch` の双方が
      data/.coop_import.lockを使い、IMAP取得、同一注文判定、分類（Jev cacheのread-modify-writeを含む）、
      注文JSON保存をプロセス間・スレッド間で直列化する。ロック取得に失敗したcronは
      import_skipped（reason=locked）を記録してsuccessで終了し、/fetchは待機せずHTTP 200の
      status=busyを返す。プロセス異常終了時はOSがロックを解放するため、残ったロックファイルは
      次回取得を妨げない。

dependencies:
  internal: [recipe-generator, recipe-search]
  external:
    - name: gmail
      required: always
    - name: typesafe.ai (api.typesafe.ai)
      required: conditional
      condition: CATEGORY_CLASSIFIER=jev かつ TYPESAFE_API_KEY設定時のみ。現状production未有効化。

deploy:
  entry: >
    deploy-coop-api.batから共通deploy.bat coop-api <local_dir>を実行し、deploy-files.txt記載の
    ファイルを/opt/apps/coop-api/へscp転送した後、ssh経由でリモートの/opt/apps/deploy.sh coop-apiを
    実行する。この共通script側でcoop-apiはUSE_VENV=yes経路のため、pip install -q -r requirements.txt
    を実行してからserviceを再起動する（VPS管理側deployment記録で確認、2026-09-27）。.envとdata/は転送しない。
  downtime: brief-restart
  rollback: 直前artifactの手動再配置＋再起動。data側のrollbackは data.persistent_paths のbackup（OPS-BKP-04）からの復元による。artifact rollbackとdata rollbackは別手順。

logging:
  destinations: [stdout]
  format: structured
  schema_version: 1
  contains_pii: false
  rotation: null

user_impact:
  direct_users: false
  client_apps: [meal-planner]
  user_facing_functions: ["COOP食材取込", "献立提案", "商品カテゴリ分類"]
